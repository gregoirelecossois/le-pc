<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Le PC à la maison - cinq petites missions pour réviser les pièces de l'ordinateur, sur téléphone." />
    <title>Le PC à la maison</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Travail à la maison, SANS compte : l'élève entre par son prénom et sa classe.
      Seule l'adresse du serveur est reprise de l'Atelier (config.js). Ni store.js ni
      compte.js : cette page n'ouvre aucune session et ne touche pas à la progression
      du jeu. Le lien distribué aux élèves porte le code de l'établissement :
          maison.html?c=CODE     (affiché dans le tableau de bord enseignant)
      Sans code, la page fonctionne en « entraînement » et n'envoie rien.
    -->
    <script src="./atelier/config.js"></script>
    <script type="module" src="/src/maison/main.tsx"></script>
  </body>
</html>
