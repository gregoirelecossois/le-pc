<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Le PC - jeu 3D pour apprendre a nommer, placer et comprendre les composants d'une unite centrale." />
    <title>Le PC — Monte ton ordinateur</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Comptes élèves, partagés avec l'Atelier informatique (voir public/atelier/).
      Scripts classiques et non modules : ils s'exécutent AVANT le module ci-dessous,
      qui est différé par nature. window.Store existe donc quand useGame s'initialise.
      Ordre imposé : config (adresse du serveur) → store (données) → compte (pastille).
      Chemins relatifs : la base Vite est './', et l'application tourne aussi en file://.
    -->
    <script src="./atelier/config.js"></script>
    <script src="./atelier/store.js"></script>
    <script src="./atelier/compte.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
